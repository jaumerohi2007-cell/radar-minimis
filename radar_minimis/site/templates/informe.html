{% extends "base.html" %}
{% block title %}Informe de minimis para expediente | Radar Minimis{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="inf-toolbar no-print">
  <a href="/minimis/">Volver a la calculadora</a>
  <button type="button" class="btn" id="inf-print" disabled>Imprimir / Guardar como PDF</button>
  <button type="button" class="btn btn-ghost" data-pro-origen="informe_pdf">Informes de toda la cartera</button>
</div>
<article id="informe" class="inf" aria-live="polite"><p class="mono small">Consultando la BDNS…</p></article>
<template id="inf-meta"
  data-attribution="{{ attribution }}"
  data-disclaimer="{{ disclaimer }}"
  data-updated="{{ updated }}"
  data-owner="{{ legal_owner }}"></template>
{% endblock %}
{% block scripts %}<script src="/static/informe.js" defer></script>{% endblock %}
